   БАЗА / СБРОС
   ============================================================ */

html,body{height:100%}
body{

}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;background:none}
input{font-family:inherit}

/* ============================================================

.field-label{font-size:12px;font-weight:700;color:#8b96ad;text-transform:uppercase;letter-spacing:.6px}

/* ============================================================

.avatar-wrap{width:74px;height:74px;flex:0 0 74px;border-radius:16px;padding:2px;

.avatar-frame{width:100%;height:100%;border-radius:14px;overflow:hidden;background:#1b2338;display:block}
.id-block{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.p-name{font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-age{font-size:12.5px;color:#9aa6bf;font-weight:600}

.hbtns{display:flex;flex-direction:column;gap:7px}

.balance-bar{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:#0f1524;border:1px solid #232e4a;border-radius:16px;padding:11px 15px}
.bal-label{font-size:11px;font-weight:800;color:#8b96ad;text-transform:uppercase;letter-spacing:.7px}
.bal-value{font-size:23px;font-weight:900;color:#34d399;font-variant-numeric:tabular-nums;letter-spacing:-.3px}

/* ============================================================

<script>
'use strict';
/* ============================================================================
   «ПУТЬ ЖИЗНИ: СИМУЛЯТОР» — монолитный браузерный симулятор жизни.
   Чистый ES6, без внешних библиотек. Интеграция с Яндекс Играми (SDK v2)
   с graceful-фоллбэком для запуска обычным браузером.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   0. ЯНДЕКС SDK — ОБЁРТКА (игра работает и без него, в обычном браузере)
--------------------------------------------------------------------------- */
const Yx = (() => {
  let sdk = null, ready = false, loadingHidden = false, gameReadySent = false;

  function init(){
    try {
      if (typeof YaGames !== 'undefined' && YaGames.init) {
        YaGames.init().then(s => { sdk = s; ready = true; hideLoading(); })
                     .catch(() => { ready = false; });
      }
    } catch (e) { /* вне песочницы Яндекса — работаем в обычном браузере */ }
  }

  function hideLoading(){
    if (ready && !loadingHidden){
      loadingHidden = true;
      try { sdk.features.LoadingAPI && sdk.features.LoadingAPI.ready(); } catch (e) {}
    }
  }

  return {
    init,
    gameReady(){
      hideLoading();
      if (ready && !gameReadySent){
        gameReadySent = true;
        try { sdk.gameReady(); } catch (e) {}
      }
    },
    gameplayStart(){ try { if (ready) sdk.gameplayStart(); } catch (e) {} },
    gameplayStop(){  try { if (ready) sdk.gameplayStop();  } catch (e) {} },
    /* Показать rewarded-рекламу. cb(true) — просмотрено до конца, cb(false) — отказ/ошибка. */
    showReward(cb){
      if (!ready){
        // Вне Яндекса: имитируем успешный просмотр с небольшой задержкой.
        setTimeout(() => cb(true), 600);
        return;
      }
      this.gameplayStop();
      try {
        sdk.getAdv({ advId: 'video', slot: 'rewardedVideoAds' })
           .then(player => player.show({
              onRejection: () => cb(false),
              onClose: (wasShown, error) => { this.gameplayStart(); cb(!!wasShown && !error); }
           }))
           .catch(() => { this.gameplayStart(); cb(false); });
      } catch (e) { this.gameplayStart(); cb(false); }
    }
  };
})();

/* ---------------------------------------------------------------------------
   1. КОНСТАНТЫ И СПРАВОЧНИКИ ДАННЫХ
--------------------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   2. УТИЛИТЫ
--------------------------------------------------------------------------- */
function clamp(v,min=0,max=100){ return Math.max(min, Math.min(max, Math.round(v))); }
function fmtMoney(n){
  const neg = n < 0 ? '−' : '';
  return neg + Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ' ₽';
}
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}
function yearsLabel(y){ return y + ' ' + plural(y,'год','года','лет'); }
function monthsLabel(m){ return m + ' ' + plural(m,'месяц','месяца','месяцев'); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2300);
}

function avatarFile(s){
  const ageBand = s.age < 18 ? 'teen' : s.age < 25 ? 'student' : s.age < 60 ? 'adult' : 'elder';
  if (s.inHospital || s.health < 20) return 'sick_' + s.gender + '.png';
  if (s.isPoor) return 'poor_' + s.gender + '.png';
  return 'avatar_' + s.gender + '_' + ageBand + '.png';
}
function avatarFallbackMeta(s){
  if (s.inHospital || s.health < 20) return { cls:'f-sick', ch:'🏥', label:'Больница' };
  if (s.isPoor) return { cls:'f-poor', ch:'🥀', label:'Бедность' };
  const band = s.age < 18 ? 'teen' : s.age < 25 ? 'student' : s.age < 60 ? 'adult' : 'elder';
  return { cls:'', ch:(s.gender==='boy'?'👦':'👧'), label:band };
}
function mountAvatar(container, file, fallbackCls, ch){
  container.innerHTML = '';
  const img = document.createElement('img');
  img.alt = 'Аватар персонажа';
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;border-radius:14px';
  img.draggable = false;
  img.onerror = () => {
    img.remove();
    const fb = document.createElement('span');
    fb.className = 'avatar-fallback ' + fallbackCls;
    fb.textContent = ch;
    container.appendChild(fb);
  };
  img.src = file;
  container.appendChild(img);
}

function newGameState(gender, name){
  return {
    version: 1,
    gender, name,
    age: 14, monthIdx: 0,              // monthIdx 0..11
    money: 0,
    food: 70, health: 80, mood: 65,
    job: null,
    foodPlan: 'doshik', homePlan: 'porch',
    ownsApartment: false, hasPC: false, hasConsole: false, medCard: false, lucky: false,
    schoolDone: false,                // аттестат в 18 лет
    isPoor: false,                    // режим бедности (кэш для аватаров/статуса)
    coursesMonths: 0, coursesDone: false,
    uniYear: 0, eduDone: false,
    businesses: {},                   // {id: count}
    diagnoses: [],                    // ["Гипертония", ...]
    inHospital: false,
    totalEarned: 0, totalSpent: 0, actionsTaken: 0,
    log: [],
    alive: true, causeOfDeath: '', bestStatus: ''
  };
}

const Save = {
  load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || typeof obj !== 'object' || obj.version !== 1 || !obj.gender || typeof obj.age !== 'number') return null;
      // Мягкая миграция недостающих полей:
      const def = newGameState(obj.gender, obj.name || 'Алексей');
      for (const k in def) if (!(k in obj)) obj[k] = def[k];
      return obj;
    }catch(e){ return null; }
  },
  save(s){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){ /* приватный режим — молча игнорируем */ }
  },
  clear(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
};

/* ---------------------------------------------------------------------------
   5. ПРОИЗВОДНЫЕ ВЕЛИЧИНЫ
--------------------------------------------------------------------------- */
function curFood(){ return FOODS.find(f=>f.id===S.foodPlan) || FOODS[0]; }
function curHome(){ return HOMES.find(h=>h.id===S.homePlan) || HOMES[0]; }
function curJob(){ return S.job ? JOBS.find(j=>j.id===S.job) : null; }
function passiveIncome(){
  let p = 0;
  for (const b of BUSINESSES) p += (S.businesses[b.id] || 0) * b.income;
  return p;
}
function monthlyExpenses(){ return curFood().price + curHome().price; }
function isPoorState(){ return S.money < 0 || (S.homePlan === 'porch' && !S.schoolDone && S.age >= 18); }
function statusLine(){
  if (S.inHospital) return '🏥 Госпитализирован(а)';
  if (S.isPoor) return '😓 Режим бедности';
  const j = curJob();
  if (j) return '💼 ' + j.name;
  if (passiveIncome() > 0) return '📈 Предприниматель';
  if (S.uniYear > 0 && S.uniYear < 4) return '🎓 Студент (' + (S.uniYear+1) + '-й курс)';
  if (S.eduDone) return '🎓 Специалист с высшим образованием';
  if (S.coursesDone) return '📜 Специалист после онлайн-курсов';
  if (!S.schoolDone && S.age < 18) return '🧑‍🎓 Школьник';
  return '🚪 Без работы';
}
function jobUnlocked(job){
  const checks = [];
  for (const r of job.reqs){
    if (r.type === undefined){ checks.push(true); continue; }
    if (r.type === 'school')  checks.push(!!S.schoolDone);
    if (r.type === 'courses') checks.push(!!S.coursesDone);
    if (r.type === 'edu')     checks.push(!!S.eduDone);
    if (r.type === 'pc')      checks.push(!!S.hasPC);
    if (r.type === 'energy')  checks.push(S.food > r.value);
  }
  return checks.every(Boolean);
}
function doctorPrice(){ return S.medCard ? 1500 : 3000; }
function clinicPrice(){ return S.medCard ? 7500 : 15000; }

   7. ЯДРО: ХОД «ПРОЖИТЬ 1 МЕСЯЦ»
--------------------------------------------------------------------------- */
let S = null; // текущее состояние (инициируется в Game.boot)

/* Публичный фасад для HTML-атрибутов onclick="Game.playMonth()" */
const Game = { playMonth(){ playMonth(); } };

function playMonth(){
  if (!S.alive) return;

  // 1) Время
  S.monthIdx++;
  if (S.monthIdx >= 12){ S.monthIdx = 0; S.age++; }

  // Школа: аттестат на ходу 18-летия
  if (!S.schoolDone && S.age >= 18){
    S.schoolDone = true;
    addLog('🎒 Вы получили аттестат! Открыта помощь повара в пиццерии.', 'good');
  }

  // Больница: месяц восстановления вместо обычной жизни
  if (S.inHospital){
    S.health = clamp(S.health + 35);
    S.mood   = clamp(S.mood - 10);
    S.inHospital = false;
    addLog('🏥 Месяц в больнице: здоровье +35%, настроение −10%. Вас выписали.', 'info');
    finishMonth();
    return;
  }

  // 2) Расходы (еда + жильё + работа "на себя")
  const exp = monthlyExpenses();
  if (exp > 0){
    S.money -= exp;
    S.totalSpent += exp;
  }

  // 3) Доходы: зарплата + пассив
  const job = curJob();
  let earned = 0;
  if (job){
    if (job.energyReq > 0 && S.food <= job.energyReq){
      addLog('😮‍💨 Не хватило сил на работу «' + job.name + '» — прогуляли месяц, зарплаты нет.', 'bad');
    } else {
      earned += job.salary;
      S.food  = clamp(S.food - job.foodCost);
      S.mood  = clamp(S.mood - job.moodCost);
    }
  }
  const pas = passiveIncome();
  earned += pas;
  if (earned > 0){ S.money += earned; S.totalEarned += earned; }

  // 4) Сытость: базовые −15% + эффект рациона (сытость может уйти в отрицательную
  //      «яму голода» — оттуда её медленно «отъедают»; на шкале видно 0%)
  const f = curFood(), h = curHome();
  S.food = Math.max(-60, S.food - 15 + f.food);

  // 5) Голодание бьёт по здоровью: за каждый недостающий до нуля процент сытости
  if (S.food <= 0){
    const hungerDamage = clamp(25 + (-S.food) * 0.5);
    S.health = clamp(S.health - hungerDamage);
    addLog('🍽️ Вы голодаете! Здоровье −' + hungerDamage + '%.', 'bad');
  } else {
    if (f.health) S.health = clamp(S.health + f.health);
  }

  // Жильё влияет на здоровье и настроение
  if (h.health) S.health = clamp(S.health + h.health);
  if (h.mood)   S.mood   = clamp(S.mood + h.mood);

  // Настроение: безработица/бедность давят, деньги радуют
  if (!job && pas === 0 && S.age >= 18) S.mood = clamp(S.mood - 5);
  if (S.money < 0) S.mood = clamp(S.mood - 5);

  // Диагнозы тянут здоровье вниз
  if (S.diagnoses.length > 0) S.health = clamp(S.health - 4 * S.diagnoses.length);

  // 6) Случайное событие (25% шанс каждый ход)
  if (Math.random() < 0.25){
    const ev = pickRandomEvent();
    let txt = ev.txt;
    if (ev.money){
      S.money += ev.money;
      if (ev.money > 0){ S.totalEarned += ev.money; } else { S.totalSpent += -ev.money; }
    }
    if (ev.food)  S.food  = clamp(S.food + ev.food);
    if (ev.health) S.health = clamp(S.health + ev.health);
    if (ev.mood)  S.mood  = clamp(S.mood + ev.mood);
    addLog(txt, ev.good ? 'good' : 'bad');
  }

  // Обучение идёт своим чередом
  if (S.coursesMonths > 0){
    S.coursesMonths--;
    if (S.coursesMonths === 0){
      S.coursesDone = true;
      addLog('🎉 Онлайн-курсы IT/Бизнеса окончены! Открыты менеджер и веб-разработка.', 'good');
    } else {
      addLog('📖 Вы учитесь на онлайн-курсах, осталось ' + monthsLabel(S.coursesMonths) + '.', 'info');
    }
  }
  if (S.uniYear > 0 && S.uniYear < 4){
    S.money -= 5000; // ~60 000 ₽/год равными частями
    S.totalSpent += 5000;
    S.uniYear++;
    if (S.uniYear >= 4){
      S.eduDone = true;
      addLog('🎓 Диплом университета получен! Открыта должность руководителя филиала.', 'good');
    } else {
      addLog('🏛️ Вы учитесь в вузе: ' + (S.uniYear+1) + '-й курс из 4.', 'info');
    }
  }

  finishMonth();
}

function finishMonth(){
  // Обновляем флаг бедности
  S.isPoor = isPoorState();

  // 7) Кризис здоровья → POP-UP
  if (S.health <= 0 && S.alive){
    renderAll();
    Save.save(S);
    Modal.showCrisis();
    return;
  }

  // 8) Старость: 75+ — с каждым годом растет шанс мирной кончины (5% + 5%/год, кап 60%)
  if (S.age >= 75){
    const chance = Math.min(0.60, 0.05 + (S.age - 75) * 0.05);
    if (Math.random() < chance){
      S.alive = false;
      S.causeOfDeath = 'Мирная кончина от старости в возрасте ' + yearsLabel(S.age) + '.';
      addLog('🕊️ Вы умерли спокойно, прожив полную жизнь.', 'info');
      renderAll(); Save.save(S); Modal.showFinal();
      return;
    }
  }

  renderAll();
  Save.save(S);
  Yx.gameReady();
}

function pickRandomEvent(){
  const pool = [];
  for (const ev of RANDOM_EVENTS){
    let w = ev.w;
    if (S.lucky && ev.good) w *= 2;
    for (let i=0;i<w;i++) pool.push(ev);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

/* ---------------------------------------------------------------------------
   8. ДЕЙСТВИЯ ВКЛАДОК (каждое = маленькое временнóе усилие + автосейв)
--------------------------------------------------------------------------- */
function afterAction(){
  S.actionsTaken++;
  S.isPoor = isPoorState();
  renderAll();
  Save.save(S);
}

const Actions = {
  hire(id){
    const job = JOBS.find(j=>j.id===id);
    if (!job || S.job === id) return;
    if (!jobUnlocked(job)){ toast('❌ Не выполнены условия должности'); return; }
    if (S.job) addLog('🔄 Вы уволились с «' + curJob().name + '» ради «' + job.name + '».', 'info');
    S.job = id;
    addLog('✅ Вы устроились: ' + job.name + ' (' + fmtMoney(job.salary) + '/мес).', 'money');
    afterAction();
  },
  fire(){
    if (!S.job) return;
    addLog('📦 Вы уволились с должности «' + curJob().name + '».', 'info');
    S.job = null;
    afterAction();
  },
  setFood(id){
    const f = FOODS.find(x=>x.id===id); if (!f) return;
    S.foodPlan = id;
    addLog('🍽️ Рацион на месяц: ' + f.name + '.', 'info');
    afterAction();
  },
  setHome(id){
    const h = HOMES.find(x=>x.id===id); if (!h) return;
    if (h.id === 'own' && !S.ownsApartment){ Actions.buyApartment(); return; }
    if (h.id === 'own' && S.ownsApartment){ S.homePlan='own'; addLog('🏢 Вы живёте в собственной квартире.', 'good'); afterAction(); return; }
    S.homePlan = id;
    addLog('🏠 Переехали: ' + h.name + ' (' + (h.price ? fmtMoney(h.price) + '/мес' : 'бесплатно') + ').', 'info');
    afterAction();
  },
  buyApartment(){
    if (S.ownsApartment) return;
    if (S.money < 4000000){ toast('❌ Нужно ' + fmtMoney(4000000) + ' на счету'); return; }
    S.money -= 4000000; S.totalSpent += 4000000;
    S.ownsApartment = true; S.homePlan = 'own';
    addLog('🏆 Куплена собственная квартира за 4 000 000 ₽! Жильё теперь бесплатное.', 'money');
    afterAction();
  },
  startCourses(){
    if (S.coursesDone){ toast('✅ Курсы уже окончены'); return; }
    if (S.coursesMonths > 0){ toast('⏳ Вы уже учитесь: осталось ' + monthsLabel(S.coursesMonths)); return; }
    if (!S.schoolDone){ toast('❌ Сначала закончите школу (18 лет)'); return; }
    if (S.money < 25000){ toast('❌ Не хватает денег (нужно 25 000 ₽)'); return; }
    S.money -= 25000; S.totalSpent += 25000; S.coursesMonths = 6;
    addLog('💻 Поступили на онлайн-курсы IT/Бизнеса. Срок — 6 месяцев.', 'info');
    afterAction();
  },
  enrollUni(){
    if (S.eduDone){ toast('✅ Высшее уже есть'); return; }
    if (S.uniYear > 0){ toast('⏳ Вы уже студент: ' + (S.uniYear+1) + '-й курс'); return; }
    if (!S.schoolDone){ toast('❌ Нужен школьный аттестат (18 лет)'); return; }
    if (S.money < 60000){ toast('❌ Первый год стоит 60 000 ₽'); return; }
    S.money -= 60000; S.totalSpent += 60000; S.uniYear = 1;
    addLog('🏛️ Вы поступили в университет! Оплата 60 000 ₽/год, срок — 4 года.', 'info');
    afterAction();
  },
  callDoctor(){
    const p = doctorPrice();
    if (S.money < p && S.money >= 0){ toast('❌ Врач стоит ' + fmtMoney(p)); return; }
    if (S.health >= 100 && S.diagnoses.length === 0){ toast('Вы полностью здоровы'); return; }
    S.money -= p; S.totalSpent += p;
    S.health = clamp(S.health + 25);
    if (S.diagnoses.length && Math.random() < 0.5){
      const d = S.diagnoses.pop();
      addLog('🩺 Врач выявил и вылечил диагноз: «' + d + '». Здоровье +25%.', 'good');
    } else {
      addLog('🩺 Вызов врача: здоровье +25% за ' + fmtMoney(p) + '.', 'good');
    }
    afterAction();
  },
  goClinic(){
    const p = clinicPrice();
    if (S.money < p && S.money >= 0){ toast('❌ Клиника стоит ' + fmtMoney(p)); return; }
    if (S.health >= 100 && S.diagnoses.length === 0){ toast('Вы полностью здоровы'); return; }
    S.money -= p; S.totalSpent += p;
    S.health = clamp(S.health + 60);
    if (S.diagnoses.length){
      addLog('🏥 Платная клиника: сняты все диагнозы (' + S.diagnoses.join(', ') + '), здоровье +60%.', 'good');
      S.diagnoses = [];
    } else {
      addLog('🏥 Платная клиника: полный чекап, здоровье +60%.', 'good');
    }
    afterAction();
  },
  walkPark(){
    S.mood = clamp(S.mood + 15);
    S.food = clamp(S.food - 3);
    addLog('🌳 Прогулка в парке: настроение +15%.', 'good');
    afterAction();
  },
  playGames(){
    if (!S.hasPC){ toast('❌ Нужен личный компьютер (магазин 💎 или вкладка Развитие)'); return; }
    const bonus = S.hasConsole ? 10 : 0;
    S.mood = clamp(S.mood + 35 + bonus);
    S.food = clamp(S.food - 5);
    addLog('🎮 Видеоигры: настроение +' + (35+bonus) + '%.', 'good');
    afterAction();
  },
  seaTrip(){
    if (S.money < 70000 && S.money >= 0){ toast('❌ Поездка стоит 70 000 ₽'); return; }
    S.money -= 70000; S.totalSpent += 70000;
    const bonus = S.hasConsole ? 10 : 0;
    S.mood = clamp(S.mood + 80 + bonus);
    S.health = clamp(S.health + 10);
    addLog('🏖️ Поездка на море: настроение +' + (80+bonus) + '%, здоровье +10%.', 'money');
    afterAction();
  },
  buyBusiness(id){
    const b = BUSINESSES.find(x=>x.id===id); if (!b) return;
    if (S.money < b.price){ toast('❌ Не хватает денег: нужно ' + fmtMoney(b.price)); return; }
    S.money -= b.price; S.totalSpent += b.price;
    S.businesses[id] = (S.businesses[id] || 0) + 1;
    addLog('📈 Куплен бизнес: ' + b.name + ' (+' + fmtMoney(b.income) + '/мес пассивно).', 'money');
    afterAction();
  },
  buyBoost(id){
    const it = SHOP_BOOSTS.find(x=>x.id===id); if (!it) return;
    if (!it.repeat && S[it.id === 'pc' ? 'hasPC' : it.id === 'console' ? 'hasConsole' : it.id === 'medcard' ? 'medCard' : 'lucky']){
      toast('✅ Этот буст уже активен'); return;
    }
    if (S.money < it.price){ toast('❌ Не хватает ' + fmtMoney(it.price)); return; }
    S.money -= it.price; S.totalSpent += it.price;
    it.effect(S);
    addLog('💎 Покупка в магазине: ' + it.name + '.', 'money');
    afterAction();
    UI.openShop(); // обновляем окно магазина
  }
};

/* ---------------------------------------------------------------------------
   9. ОТРИСОВКА UI
--------------------------------------------------------------------------- */
function fillClass(v){
  if (v >= 60) return 'f-green';
  if (v >= 40) return 'f-lime';
  if (v >= 25) return 'f-yellow';
  if (v >= 12) return 'f-orange';
  return 'f-red';
}
function textColor(v){
  if (v >= 60) return 't-green';
  if (v >= 40) return 't-lime';
  if (v >= 25) return 't-yellow';
  if (v >= 12) return 't-orange';
  return 't-red';
}

function renderHeader(){
  const file = avatarFile(S), meta = avatarFallbackMeta(S);
  mountAvatar($('main-avatar'), file, meta.cls, meta.ch);
  $('hud-name').textContent = S.name;
  $('hud-age').textContent = yearsLabel(S.age) + ' ' + monthsLabel(S.monthIdx);
  const st = statusLine();
  if (st.indexOf('Без работы') === -1 && !S.inHospital) S.bestStatus = st;
  $('hud-status').textContent = st;
  const bal = $('hud-balance');
  bal.textContent = fmtMoney(S.money);
  bal.classList.toggle('neg', S.money < 0);
  const p = passiveIncome();
  const chip = $('hud-passive');
  chip.style.display = p > 0 ? '' : 'none';
  chip.textContent = '+' + fmtMoney(p) + '/мес';
}

function renderStats(){
  // Сытость может быть в «яме голода» (отрицательный скрытый долг) — на шкале всегда 0..100%
  const map = [['food',clamp(S.food)],['health',S.health],['mood',S.mood]];
  for (const [k,v] of map){
    const bar = $('bar-'+k), val = $('val-'+k);
    bar.style.width = v + '%';
    bar.className = 'fill ' + fillClass(v);
    val.textContent = v + '%';
    val.className = 'stat-val ' + textColor(v);
  }
}

function renderLog(){
  const box = $('event-log');
  box.innerHTML = '';
  const items = S.log.slice(0, 4);
  if (!items.length){
    box.innerHTML = '<div class="ev info"><span class="ev-date">Старт</span> Жизнь началась. Удачного пути!</div>';
    return;
  }
  for (const e of items){
    const d = document.createElement('div');
    d.className = 'ev ' + e.type;
    d.innerHTML = '<span class="ev-date">' + e.age + ' г., ' + e.mon + ' мес.</span>' + esc(e.text);
    box.appendChild(d);
  }
}

/* ---- Вкладка РАБОТА ---- */
function renderWorkPage(){
  const groups = [
    ['🌃 Улица', 'street'],
    ['🌱 Начальная', 'entry'],
    ['🚀 Карьера', 'career']
  ];
  let html = '';
  for (const [title, cat] of groups){
    html += '<div class="group-head">' + title + '</div>';
    for (const job of JOBS.filter(j=>j.cat===cat)){
      const active = S.job === job.id;
      const unlocked = jobUnlocked(job);
      let chips = '';
      for (const r of job.reqs){
        if (r.type === undefined){ chips += '<span class="chip ok">' + esc(r.txt) + '</span>'; continue; }
        let ok = false;
        if (r.type==='school') ok = !!S.schoolDone;
        if (r.type==='courses') ok = !!S.coursesDone;
        if (r.type==='edu') ok = !!S.eduDone;
        if (r.type==='pc') ok = !!S.hasPC;
        if (r.type==='energy') ok = S.food > r.value;
        chips += '<span class="chip ' + (ok?'ok':'no') + '">' + (ok?'✓ ':'✗ ') + esc(r.txt) + '</span>';
      }
      let btn;
      if (active){
        btn = '<button class="btn btn-fire" onclick="Actions.fire()">Уволиться</button>';
      } else if (unlocked){
        btn = '<button class="btn btn-hire" onclick="Actions.hire(\'' + job.id + '\')">Устроиться</button>';
      } else {
        btn = '<button class="btn btn-disabled">Недоступно</button>';
      }
      html +=
      '<div class="card' + (active?' card-activejob':'') + '">' +
        '<div class="card-top"><div class="card-title">' + job.icon + ' ' + esc(job.name) + '</div>' +
        '<div class="card-income">+' + fmtMoney(job.salary) + '/мес</div></div>' +
        '<div class="card-desc">' + esc(job.desc) + '</div>' +
        '<div class="chips">' + chips + '</div>' +
        '<div class="card-actions">' + btn + '</div>' +
      '</div>';
    }
  }
  $('page-work').innerHTML = html;
}

function sign(v){ return (v>0?'+':(v<0?'−':'0')) + Math.abs(v); }

          toast('Реклама не просмотрена — выберите больницу');
        }
      });
    };
    $('crisis-hosp').onclick = () => {
      if (S.money < 20000){
        S.alive = false;
        S.causeOfDeath = 'Смерть в больнице: не хватило 20 000 ₽ на лечение.';
        addLog('💀 Деньгов на лечение не нашлось…', 'bad');
        this.close(); renderAll(); Save.save(S); this.showFinal();
        return;
      }
      S.money -= 20000; S.totalSpent += 20000;
      S.inHospital = true;
      S.health = 20; // стабилизировали на нулевой отметке
      addLog('🏥 Вы легли в больницу со штрафом 20 000 ₽.', 'bad');
      this.close(); afterAction();
    };
  },
  showSettings(){
    this.open(
      '<h2>⚙️ Настройки</h2>' +
      '<div class="final-stats">' +
        '<div class="row-line"><span>Звук игры</span><button class="btn btn-sel" style="flex:0 0 auto;padding:7px 14px" id="snd-toggle">' + (Sound.on ? '🔊 Вкл' : '🔇 Выкл') + '</button></div>' +
        '<div class="row-line"><span>Сохранение</span><b style="color:#4ade80">Авто ✅</b></div>' +
        '<div class="row-line"><span>Версия</span><b>v1.0</b></div>' +
        '<div class="row-line" style="border-bottom:none"><span>Прожито месяцев</span><b>' + ((S.age-14)*12 + S.monthIdx) + '</b></div>' +
      '</div>' +
      '<button class="btn btn-fire" id="reset-btn">🔄 Начать жизнь заново</button>' +
      '<button class="m-close" onclick="Modal.close()">Закрыть</button>'
    );
    $('snd-toggle').onclick = () => { Sound.toggle(); $('snd-toggle').textContent = Sound.on ? '🔊 Вкл' : '🔇 Выкл'; };
    $('reset-btn').onclick = () => {
      if (confirm('Вы уверены? Весь прогресс этой жизни будет стёрт безвозвратно!')){
        Save.clear();
        location.reload();
      }
    };
  },
  showShop(){
    let html = '<h2>💎 Магазин и бусты</h2><div class="m-sub">Улучшения, которые меняют правила игры. Баланс: <b style="color:#34d399">' + fmtMoney(S.money) + '</b></div>';
    for (const it of SHOP_BOOSTS){
      const ownedOnce = !it.repeat && (
        (it.id==='pc'&&S.hasPC)||(it.id==='console'&&S.hasConsole)||(it.id==='medcard'&&S.medCard)||(it.id==='luck'&&S.lucky)
      );
      html += '<div class="shop-item"><div><div class="si-t">' + it.name + (ownedOnce?' <span class="chip gold">Активен</span>':'') + '</div><div class="si-d">' + it.desc + '</div></div>' +
        (ownedOnce ? '<button class="btn btn-disabled" style="flex:0 0 auto;padding:9px 13px">✓</button>' :
          '<button class="btn ' + (S.money>=it.price?'btn-buy':'btn-disabled') + '" style="flex:0 0 auto;padding:9px 13px" onclick="Actions.buyBoost(\'' + it.id + '\')">' + fmtMoney(it.price) + '</button>') +
        '</div>';
    }
    html += '<button class="m-close" onclick="Modal.close()">Закрыть</button>';
    this.open(html);
  },
  showFinal(){
    const monthsLived = (S.age-14)*12 + S.monthIdx;
    const bizCount = Object.values(S.businesses).reduce((a,b)=>a+b,0);
    let rank;
    if (S.money >= 5000000) rank = '👑 Олигард';
    else if (S.money >= 1000000) rank = '💎 Капиталист';
    else if (S.money >= 300000) rank = '🏆 Состоятельный гражданин';
    else if (S.money >= 0) rank = '🙂 Обычный человек';
    else rank = '🥀 Банкрот';
    this.open(
      '<div class="crisis-icon">🪦</div>' +
      '<h2>ЭКРАН ИТОГОВ ЖИЗНИ</h2>' +
      '<div class="m-sub">' + esc(S.causeOfDeath || 'Жизнь завершена.') + '</div>' +
      '<div class="final-stats">' +
        '<div class="row-line"><span>Имя</span><b>' + esc(S.name) + '</b></div>' +
        '<div class="row-line"><span>Прожили</span><b>' + yearsLabel(S.age) + ' (' + monthsLived + ' мес. в игре)</b></div>' +
        '<div class="row-line"><span>Заработано всего</span><b style="color:#34d399">' + fmtMoney(S.totalEarned) + '</b></div>' +
        '<div class="row-line"><span>Потрачено всего</span><b style="color:#f87171">' + fmtMoney(S.totalSpent) + '</b></div>' +
        '<div class="row-line"><span>Финальный баланс</span><b>' + fmtMoney(S.money) + '</b></div>' +
        '<div class="row-line"><span>Кем стали</span><b>' + esc(S.bestStatus || 'Кем-то') + '</b></div>' +
        '<div class="row-line"><span>Бизнесов куплено</span><b>' + bizCount + '</b></div>' +
        '<div class="row-line" style="border-bottom:none"><span>Итоговый ранг</span><b>' + rank + '</b></div>' +
      '</div>' +
      '<button class="btn btn-primary" style="max-width:none" onclick="Save.clear();location.reload()">🌱 Прожить новую жизнь</button>'
    );
  }
};
$('modal-back').addEventListener('click', (e) => {
  // Закрытие по клику на затемнение — только для неблокирующих окон
  if (e.target === $('modal-back') && S && !S.alive) return; // экран смерти не закрывается
  if (e.target === $('modal-back') && S && S.health <= 0 && !S.inHospital) return; // кризис обязателен
  Modal.close();
});

/* ---------------------------------------------------------------------------
   11. ЗВУК (WebAudio, без внешних файлов)
--------------------------------------------------------------------------- */
const Sound = {
  on: true, ctx: null,
  ensure(){ try{ if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} },
  blip(freq, dur=0.08, type='triangle', gain=0.05){
    if(!this.on) return;
    this.ensure(); if(!this.ctx) return;
    try{
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+dur);
      o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+dur);
    }catch(e){}
  },
  click(){ this.blip(520,.06); },
  cash(){ this.blip(880,.09,'square',.04); setTimeout(()=>this.blip(1175,.12,'square',.04),90); },
  bad(){ this.blip(180,.2,'sawtooth',.05); },
  toggle(){ this.on=!this.on; try{localStorage.setItem(SAVE_KEY+'_snd',this.on?'1':'0');}catch(e){} this.click(); }
};
try{ const sv = localStorage.getItem(SAVE_KEY+'_snd'); if(sv!==null) Sound.on = sv==='1'; }catch(e){}

/* ---------------------------------------------------------------------------
   12. UI-КОНТРОЛЛЕР (табы, экраны)
--------------------------------------------------------------------------- */
const UI = {
  switchTab(name){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===name));
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    $('page-'+name).classList.add('active');
    Sound.click();
  },
  openSettings(){ Sound.click(); Modal.showSettings(); },
  openShop(){ Sound.click(); Modal.showShop(); },
  showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $(id).classList.add('active');
  }
};

/* ---------------------------------------------------------------------------
   13. ЭКРАН СТАРТА
--------------------------------------------------------------------------- */
const StartScreen = {
  gender: 'boy',
  pickGender(g){
    this.gender = g;
    $('g-boy').classList.toggle('sel', g==='boy');
    $('g-girl').classList.toggle('sel', g==='girl');
    const inp = $('inp-name');
    if (!inp.dataset.edited) inp.placeholder = g==='boy' ? 'Алексей' : 'Анна';
    Sound.click();
  },
  begin(){
    const raw = $('inp-name').value.trim();
    const name = raw.length ? raw.slice(0,16) : (this.gender==='boy' ? 'Алексей' : 'Анна');
    S = newGameState(this.gender, name);
    S.isPoor = isPoorState();
    addLog('🌱 ' + name + ', вам 14 лет. Впереди целая жизнь! Выберите еду, жильё и первую работу на улице.', 'good');
    Save.save(S);
    bootIntoGame();
    Sound.cash();
  }
};

/* ---------------------------------------------------------------------------
   14. ЗАГРУЗКА ИГРЫ
--------------------------------------------------------------------------- */
function bootIntoGame(){
  UI.showScreen('screen-game');
  renderAll();
  Yx.gameReady();
}
function boot(){
  // Превью аватаров на экране выбора (с фоллбэком)
  mountAvatar($('prev-boy-holder'), 'avatar_boy_teen.png', '', '👦');
  mountAvatar($('prev-girl-holder'), 'avatar_girl_teen.png', '', '👧');
  $('inp-name').addEventListener('input', e=>{ e.target.dataset.edited='1'; });

  const saved = Save.load();
  if (saved && saved.alive){
    S = saved;
    S.isPoor = isPoorState();
    bootIntoGame();
  } else if (saved && !saved.alive){
    // Сохранение с умершим персонажем — показываем финал поверх старта
    S = saved;
    S.isPoor = isPoorState();
    bootIntoGame();
    Modal.showFinal();
  } else {
    UI.showScreen('screen-start');
  }
  Yx.init();
}

/* Перехват кликов для звука + защита от двойных тапов на мобильных */
document.addEventListener('pointerdown', (e)=>{
  const b = e.target.closest && e.target.closest('button');
  if (b && !b.classList.contains('btn-disabled')) Sound.click();
}, {passive:true});

window.addEventListener('error', ()=>{ /* тихая деградация: игра не должна ронять UI */ });

boot();
</script>
